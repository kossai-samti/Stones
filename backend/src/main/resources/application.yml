spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/litha}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB
server:
  port: ${PORT:9090}
